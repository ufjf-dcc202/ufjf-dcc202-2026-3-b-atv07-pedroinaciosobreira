<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <main>
        <h1>CSS em linha:</h1>
        <p>Voce pode aplicar um estilo <em style="color: green; text-decoration:underline; font-family: sans-serif;">Linha</em> para um elemento usando um atributo <code>style</code></p>
        <dl>
            <div>
                <dt><code>color</code></dt>
                <dd>Cor do texto do elemento</dd>
            </div>
            <div>
                <dt><code>background-color</code></dt>
                <dd>Cor de fundo do elemento</dd>
            </div>
        </dl>
    </main>
</body>
</html>
